<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Time Clock</title>
  <meta name="theme-color" content="#163a70">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Sign in -->
  <main id="auth-view" class="auth" hidden>
    <div class="auth-hero">
      <svg class="ico auth-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <h1>Time Clock</h1>
      <p>Clock in and out with a photo.</p>
    </div>
    <form id="auth-form" class="card stack" autocomplete="on">
      <h2 id="auth-title">Sign in</h2>
      <label id="name-field" hidden>Full name
        <input id="name" type="text" autocomplete="name">
      </label>
      <label>Email
        <input id="email" type="email" required autocomplete="email">
      </label>
      <label>Password
        <input id="password" type="password" required minlength="6" autocomplete="current-password">
      </label>
      <p id="auth-msg" class="msg" role="status"></p>
      <button class="btn primary" type="submit" id="auth-submit">Sign in</button>
      <button class="btn link" type="button" id="auth-toggle">New here? Create an account</button>
    </form>
  </main>

  <div id="app-view" hidden>
    <!-- HOME -->
    <section id="view-home" class="screen">
      <header class="home-head">
        <div class="hello" id="hello"></div>
        <div class="date" id="today"></div>
      </header>

      <div class="times">
        <div class="tcol">
          <span class="tlabel">In</span>
          <div class="tbox" id="t-in" aria-live="polite"></div>
        </div>
        <div class="tcol">
          <span class="tlabel">Out</span>
          <div class="tbox" id="t-out" aria-live="polite"></div>
        </div>
      </div>
      <p class="status" id="status"></p>

      <label class="remarks">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></svg>
        <input id="remarks" type="text" maxlength="300" placeholder="Enter remarks" aria-label="Remarks">
      </label>

      <div class="cam-wrap" id="cam-wrap">
        <button class="cam-tile" id="cam-tile" type="button" aria-label="Take a photo to clock in or out">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3V19H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        </button>
        <span class="cam-cap" id="cam-cap">Take photo to clock in</span>
      </div>

      <button class="btn clock" id="punch" type="button">Clock In</button>
      <p class="msg" id="clock-msg" role="status"></p>
    </section>

    <!-- HISTORY -->
    <section id="view-history" class="screen" hidden>
      <h1 class="page-title">History</h1>

      <div class="monthbar">
        <button class="icon-btn" id="m-prev" type="button" aria-label="Previous month">&#8249;</button>
        <div class="month-label" id="m-label" aria-live="polite"></div>
        <button class="icon-btn" id="m-next" type="button" aria-label="Next month">&#8250;</button>
      </div>

      <label class="person" id="person-wrap" hidden>Employee
        <select id="person"></select>
      </label>

      <div class="stats">
        <div><span class="k">Total hours</span><span class="v" id="h-total">0.00</span></div>
        <div><span class="k">Days worked</span><span class="v" id="h-days">0</span></div>
      </div>

      <button class="btn primary wide-btn" id="export" type="button">Export to Excel</button>
      <p class="msg" id="h-msg" role="status"></p>

      <div class="h-list" id="h-list"></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="screen" hidden>
      <h1 class="page-title">Settings</h1>

      <div class="card stack">
        <h2>Account</h2>
        <dl class="kv">
          <dt>Name</dt><dd id="s-name"></dd>
          <dt>Email</dt><dd id="s-email"></dd>
          <dt>Role</dt><dd id="s-role"></dd>
          <dt>Time zone</dt><dd id="s-tz"></dd>
          <dt>Photo</dt><dd id="s-photo"></dd>
        </dl>
      </div>

      <form class="card stack" id="pw-form">
        <h2>Change password</h2>
        <label>New password
          <input id="new-password" type="password" minlength="6" required autocomplete="new-password">
        </label>
        <p class="msg" id="pw-msg" role="status"></p>
        <button class="btn" type="submit" id="pw-submit">Update password</button>
      </form>

      <button class="btn danger" id="signout" type="button">Sign out</button>
    </section>

    <nav class="nav" aria-label="Main">
      <div class="nav-inner">
        <button type="button" data-view="home" class="active" aria-current="page">
          <span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span>
          <span>Home</span>
        </button>
        <button type="button" data-view="history" aria-current="false">
          <span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4h4"/><path d="M12 7.5V12l3 2"/></svg></span>
          <span>History</span>
        </button>
        <button type="button" data-view="settings" aria-current="false">
          <span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>
          <span>Settings</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Camera -->
  <dialog id="cam" class="cam" aria-labelledby="cam-title">
    <div class="cam-box">
      <h3 id="cam-title">Take a selfie</h3>
      <div class="cam-stage">
        <video id="cam-video" autoplay playsinline muted></video>
        <img id="cam-shot" alt="Preview of your photo" hidden>
      </div>
      <p class="msg" id="cam-msg" role="status"></p>
      <div class="cam-actions">
        <button class="btn" id="cam-cancel" type="button">Cancel</button>
        <button class="btn" id="cam-retake" type="button" hidden>Retake</button>
        <button class="btn primary" id="cam-capture" type="button">Take photo</button>
        <button class="btn primary" id="cam-confirm" type="button" hidden>Use photo</button>
      </div>
      <input type="file" id="cam-file" accept="image/*" capture="user" hidden>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/app.js"></script>
</body>
</html>
